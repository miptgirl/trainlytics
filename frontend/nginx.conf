server {
    listen 80;

    client_max_body_size 500m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # The bundle entry: browsers revalidate it, so a deploy's new hashed assets are
    # picked up. `/` and SPA routes (the try_files fallback) end up here too.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # A host name in proxy_pass is resolved once, at nginx start; a recreated
        # backend container gets a new IP and requests would 502. Resolving per
        # request (cached 10s) follows it. The image's entrypoint fills in the
        # container's nameserver (Docker: 127.0.0.11) from /etc/resolv.conf, see
        # NGINX_ENTRYPOINT_LOCAL_RESOLVERS in the Dockerfile.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        # No URI part, so the request URI is passed on unchanged, as before
        proxy_pass $backend_upstream;
        # Fail fast instead of hanging on a stale cached backend IP
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

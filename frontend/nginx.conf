server {
    listen 80;

    client_max_body_size 500m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # A host name in proxy_pass is resolved once, at nginx start; a recreated
        # backend container gets a new IP and requests would 502. Resolving per
        # request (cached 10s) follows it. The image's entrypoint fills in the
        # container's nameserver (Docker: 127.0.0.11) from /etc/resolv.conf, see
        # NGINX_ENTRYPOINT_LOCAL_RESOLVERS in the Dockerfile.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        # No URI part, so the request URI is passed on unchanged, as before
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

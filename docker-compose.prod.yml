services:
  db:
    image: postgres:16
    command: postgres -c synchronous_commit=off
    restart: always
    environment:
      POSTGRES_USER: trainlytics
      POSTGRES_PASSWORD: trainlytics
      POSTGRES_DB: trainlytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlytics"]
      interval: 60s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trainlytics:trainlytics@db:5432/trainlytics
      DEBUG_SQL_ENABLED: "true"
      # Never enable the demo login in production. Set here (not via .env) because
      # `environment:` overrides `env_file:`, so a stray .env line can't turn it on.
      DEMO_USER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    # no volume mount — uses the image's baked-in code

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
